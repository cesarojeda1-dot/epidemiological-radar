version: '3.8'
services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    image: node:18
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install --no-audit --no-fund && node server.js"
    ports:
      - "4000:4000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/ghsentinel
      - PORT=4000
    depends_on:
      - mongo
      - redis

  frontend:
    image: node:18
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    command: sh -c "cd /app/frontend && npm install --no-audit --no-fund && npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  mongo-data:
